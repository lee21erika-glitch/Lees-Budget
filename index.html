<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lee's Budget</title>

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">

    <meta name="theme-color" content="#2E7D32">
</head>

<body>

<header>
    <h1>💰 Lee's Budget</h1>
</header>

<div class="card">
    <h2>Money Left This Month</h2>
    <div id="moneyLeft">$2,555</div>
</div>

<div class="card">
    <h2>Budget Categories</h2>

    <div class="category">
        <span>Groceries</span>
        <span id="groceries">$600</span>
    </div>

    <div class="category">
        <span>Fuel</span>
        <span id="fuel">$425</span>
    </div>

    <div class="category">
        <span>Dining</span>
        <span id="dining">$175</span>
    </div>

    <div class="category">
        <span>Household</span>
        <span>$150</span>
    </div>

    <div class="category">
        <span>Kids</span>
        <span>$150</span>
    </div>

    <div class="category">
        <span>Pets</span>
        <span>$100</span>
    </div>

    <div class="category">
        <span>Shopping</span>
        <span>$100</span>
    </div>

    <div class="category">
        <span>Entertainment</span>
        <span>$60</span>
    </div>

    <div class="category">
        <span>Misc.</span>
        <span>$100</span>
    </div>

    <div class="category">
        <span>Savings</span>
        <span>$695</span>
    </div>

</div>

<div class="card">

<h2>Bills</h2>

<label><input type="checkbox"> Rent</label><br>
<label><input type="checkbox"> Car Payment</label><br>
<label><input type="checkbox"> Klarna</label><br>
<label><input type="checkbox"> T-Mobile</label><br>
<label><input type="checkbox"> Insurance</label><br>
<label><input type="checkbox"> Signature Loan</label><br>

</div>

<div class="card">

<h2>Add Expense</h2>

<input id="amount" type="number" placeholder="Amount">

<select id="category">

<option>Groceries</option>
<option>Fuel</option>
<option>Dining</option>
<option>Household</option>
<option>Kids</option>
<option>Pets</option>
<option>Shopping</option>
<option>Entertainment</option>
<option>Miscellaneous</option>

</select>

<button onclick="addExpense()">
Add Expense
</button>

</div>

<script src="app.js"></script>

</body>
</html>
